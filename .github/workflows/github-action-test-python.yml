name: Python CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      # Run all versions to the end, even if one of them fails
      fail-fast: false
      matrix:
        # You need to change to branch protection rules if you change the versions here
        python-version: [3.12.11, 3.13.7, 3.14.0, 3.14.7, 3.15.0-rc.2]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test
        run: |
          cd python && ./allTestsForPyVersion
      - name: Test pytrace-generator
        run: |
          python3 pytrace-generator/test/runTests.py
