<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 style-src {{CSP_SOURCE}} 'unsafe-inline';
                 script-src 'nonce-{{NONCE}}' {{CSP_SOURCE}};
                 img-src {{CSP_SOURCE}} data:;
                 connect-src {{CSP_SOURCE}};
                 font-src {{CSP_SOURCE}};" />

  <link rel="stylesheet" href="{{WEBVIEW_CSS}}" />
  <title>Code Visualization</title>
</head>

<body>
  <div class="column scrollable" id="viz">
    <!-- ELK-based visualization, see elk-task/elk-plan.md -->
    <!-- #elk-viewport clips and receives the pan/zoom gestures, #elk-canvas is transformed -->
    <div id="elk-viewport">
      <div id="elk-canvas"></div>

      <!-- Floats over the canvas rather than scrolling with it. data-elk-ui tells
           pan-zoom.ts that events in here are UI, not canvas gestures. -->
      <div class="elk-controls" data-elk-ui>
        <button id="expandAllButton" type="button" title="Expand every collapsed object" hidden>Expand all</button>
        <button id="fitButton" type="button" title="Zoom to fit">Fit</button>
        <button class="elk-icon-button" id="zoomOutButton" type="button" aria-label="Zoom out" title="Zoom out">
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false">
            <circle cx="6.75" cy="6.75" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5" />
            <line x1="9.9" y1="9.9" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="4.5" y1="6.75" x2="9" y2="6.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
        <button class="elk-icon-button" id="zoomInButton" type="button" aria-label="Zoom in" title="Zoom in">
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false">
            <circle cx="6.75" cy="6.75" r="4.25" fill="none" stroke="currentColor" stroke-width="1.5" />
            <line x1="9.9" y1="9.9" x2="14" y2="14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="4.5" y1="6.75" x2="9" y2="6.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            <line x1="6.75" y1="4.5" x2="6.75" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="row" id="bottom-area">
    <div class="column floating-left">
      <div class="slidecontainer">
        <input
          type="range"
          min="0"
          max="0"
          value="0"
          class="slider"
          id="traceSlider"
        />
      </div>

      <div class="row margin-vertical">
        <p>Step&nbsp;</p>
        <p id="indexCounter">0</p>
        <p id="traceMax">/?</p>
      </div>

      <div class="row margin-vertical">
        <button class="margin-horizontal" id="firstButton" type="button" aria-label="Go to first step" title="First step">&#9198</button>
        <button class="margin-horizontal" id="prevButton" type="button" aria-label="Go to previous step" title="Previous step">&#9664</button>
        <button class="margin-horizontal" id="nextButton" type="button" aria-label="Go to next step" title="Next step">&#9654</button>
        <button class="margin-horizontal" id="lastButton" type="button" aria-label="Go to last step" title="Last step">&#9197</button>
      </div>
    </div>

    <div class="column floating-right">
      <pre class="scrollable" id="stdout-log"></pre>
    </div>
  </div>

  <!-- scripts -->
  <!-- example trace for web-dev -->
  <script nonce="{{NONCE}}" src="./example-trace-content.js"></script>

  <script nonce="{{NONCE}}" src="{{VSCODE_HOST_ADAPTER_JS}}"></script>

  <script nonce="{{NONCE}}" src="{{WEBVIEW_JS}}"></script>

</body>
</html>
